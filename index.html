<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Absolute Favorite ❤️</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f0c1b, #240b36);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            color: #ffffff;
        }

        /* Ambient background glow */
        .glow-bg {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255, 75, 110, 0.2) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            pointer-events: none;
        }

        /* Elegant Presentation Container */
        .reveal-wrapper {
            position: relative;
            text-align: center;
            z-index: 2;
            width: 90%;
            max-width: 450px;
            padding: 40px 20px;
            cursor: pointer;
        }

        /* Initial State Text */
        .tap-prompt {
            font-size: 16px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.7);
            animation: pulse 2s infinite alternate ease-in-out;
            transition: opacity 0.5s ease;
        }

        /* Gorgeous Text Layout */
        .gorgeous-message {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s cubic-bezier(0.23, 1, 0.32, 1);
            pointer-events: none;
        }

        .reveal-wrapper.active .tap-prompt {
            opacity: 0;
            display: none;
        }

        .reveal-wrapper.active .gorgeous-message {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .main-headline {
            font-size: 32px;
            font-weight: 300;
            letter-spacing: 2px;
            background: linear-gradient(to right, #ff416c, #ff4b2b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }

        .sub-message {
            font-size: 18px;
            line-height: 1.8;
            font-weight: 300;
            color: #e0e0e0;
            margin-bottom: 30px;
        }

        /* Floating Interactive Elements */
        .sticker-element {
            font-size: 28px;
            display: inline-block;
            margin: 0 10px;
            filter: drop-shadow(0 0 10px rgba(255,65,108,0.5));
        }

        .floating-stickers {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        .dance-1 { animation: FloatMotion 3s infinite alternate ease-in-out; }
        .dance-2 { animation: FloatMotion 3.5s infinite alternate ease-in-out 0.5s; }
        .dance-3 { animation: FloatMotion 2.8s infinite alternate ease-in-out 0.2s; }

        @keyframes pulse {
            0% { transform: scale(0.96); opacity: 0.5; }
            100% { transform: scale(1); opacity: 0.9; }
        }

        @keyframes FloatMotion {
            0% { transform: translateY(0px) rotate(-5deg); }
            100% { transform: translateY(-12px) rotate(5deg); }
        }
    </style>
</head>
<body>

    <div class="glow-bg"></div>

    <div class="reveal-wrapper" onclick="revealWish(this)">
        <div class="tap-prompt">Tap to reveal my wish for you...</div>
        
        <div class="gorgeous-message">
            <h1 class="main-headline">Happy National Boyfriend Day!</h1>
            <p class="sub-message">
                You make every ordinary moment feel completely extraordinary. Thank you for being my anchor, my absolute peace, and my favorite person to laugh with. 
            </p>
            <div class="floating-stickers">
                <span class="sticker-element dance-1">🕺💃</span>
                <span class="sticker-element dance-2">💋❤️</span>
                <span class="sticker-element dance-3">🐰🐻</span>
            </div>
        </div>
    </div>

    <script>
        function revealWish(element) {
            element.classList.add('active');
        }
    </script>
</body>
</html>
